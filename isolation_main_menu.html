<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISOLATION — Equator Station</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --scr-bg-1:#3d4d5f;
    --scr-bg-2:#28323e;
    --scr-line:rgba(178,201,222,0.28);
    --scr-line-strong:rgba(198,217,232,0.55);
    --scr-text:#cddbe6;
    --scr-text-dim:#8fa3b5;
    --scr-cyan:#8fd6ff;
    --scr-amber:#e8b56a;
    --phosphor:0 0 6px rgba(159,216,255,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#050607;
    display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:520px;
    aspect-ratio:905/1738;
    container-type: inline-size;
    overflow:hidden;
  }
  .bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.02);
  }

  /* ---- the terminal screen, positioned to match the physical bezel in the photo ---- */
  .screen{
    position:absolute;
    left:4.2%; top:19.2%;
    width:91.3%; height:49.2%;
    border-radius: 1.2cqw / 1.6cqh;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 38%, var(--scr-bg-1) 0%, var(--scr-bg-2) 78%, #1b232c 100%);
    box-shadow:
      inset 0 0 3cqw 1cqw rgba(0,0,0,0.55),
      inset 0 0 0.6cqw rgba(210,230,245,0.15);
    animation: powerOn 1.1s ease-out both;
  }
  @keyframes powerOn{
    0%{ filter:brightness(0.2) saturate(0); opacity:0.4; }
    12%{ filter:brightness(2.2) saturate(0.4); opacity:1; }
    22%{ filter:brightness(0.7); }
    35%{ filter:brightness(1.4); }
    50%{ filter:brightness(0.95); }
    100%{ filter:brightness(1); }
  }

  .screen-content{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding: 2.6cqw 3cqw 1.6cqw;
    color:var(--scr-text);
  }

  /* CRT overlay effects */
  .crt-scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(
      to bottom,
      rgba(10,14,18,0.16) 0px,
      rgba(10,14,18,0.16) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:multiply;
  }
  .crt-vignette{
    position:absolute; inset:0; pointer-events:none; z-index:6;
    background:radial-gradient(120% 100% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  .crt-sweep{
    position:absolute; left:0; right:0; height:22%; z-index:7; pointer-events:none;
    background:linear-gradient(to bottom, rgba(210,235,255,0.08), rgba(210,235,255,0) 100%);
    animation: sweep 7s linear infinite;
  }
  @keyframes sweep{
    0%{ top:-25%; }
    100%{ top:105%; }
  }
  .crt-flicker{
    position:absolute; inset:0; pointer-events:none; z-index:8;
    background:rgba(255,255,255,0.02);
    animation:flicker 5.5s infinite;
  }
  @keyframes flicker{
    0%,93%,100%{ opacity:0; }
    94%{ opacity:1; }
    95%{ opacity:0; }
    96%{ opacity:0.6; }
    97%{ opacity:0; }
  }

  /* ---- header ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:1.6cqw;
    border-bottom:1px solid var(--scr-line);
    flex:0 0 auto;
  }
  .brand{ display:flex; align-items:center; gap:1.6cqw; }
  .brand-mark{
    width:6.4cqw; height:6.4cqw; min-width:20px; min-height:20px;
    border-radius:50%;
    border:1.4px solid var(--scr-text);
    position:relative;
    flex:0 0 auto;
  }
  .brand-mark::before{
    content:""; position:absolute; inset:22%;
    border-radius:50%;
    border:1.4px solid var(--scr-text);
    border-right-color:transparent;
    border-bottom-color:transparent;
    transform:rotate(45deg);
  }
  .brand-text{ line-height:1.05; }
  .brand-text .b1{
    font-size:3.6cqw; font-weight:700; letter-spacing:0.09em;
    text-shadow:var(--phosphor);
  }
  .brand-text .b2{
    font-size:2.2cqw; font-weight:500; letter-spacing:0.28em;
    color:var(--scr-text-dim);
  }
  .topbar-right{ display:flex; align-items:center; gap:2.6cqw; }
  .clock{
    font-family:'JetBrains Mono',monospace; font-size:3cqw; letter-spacing:0.04em;
    color:var(--scr-text);
  }
  .icon-btn{
    width:6cqw; height:6cqw; min-width:18px; min-height:18px;
    display:flex; align-items:center; justify-content:center;
    color:var(--scr-text-dim);
  }
  .icon-btn svg{ width:70%; height:70%; }

  /* ---- HUD: player card ---- */
  .hud{
    flex:0 0 auto;
    margin-top:1.8cqw;
    display:flex; align-items:center; gap:2.2cqw;
    padding:1.8cqw 2.2cqw;
    border:1px solid var(--scr-line);
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border-radius:1cqw;
  }
  .hud-level{
    flex:0 0 auto;
    width:8.6cqw; height:8.6cqw; min-width:26px; min-height:26px;
    border-radius:50%;
    border:1.6px solid var(--scr-cyan);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    box-shadow:0 0 1.4cqw rgba(143,214,255,0.35);
  }
  .hud-level .lv-num{
    font-family:'JetBrains Mono',monospace;
    font-size:3.4cqw; font-weight:600; color:var(--scr-cyan);
    line-height:1;
    text-shadow:var(--phosphor);
  }
  .hud-level .lv-lbl{
    font-size:1.7cqw; letter-spacing:0.14em; color:var(--scr-text-dim);
    margin-top:0.2cqw;
  }
  .hud-mid{ flex:1 1 auto; min-width:0; }
  .hud-name-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:1cqw;
  }
  .hud-name{
    font-size:3.4cqw; font-weight:600; letter-spacing:0.04em;
    text-shadow:var(--phosphor);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .hud-xp-label{
    font-family:'JetBrains Mono',monospace;
    font-size:2cqw; color:var(--scr-text-dim); flex:0 0 auto;
  }
  .hud-bar{
    margin-top:1.1cqw;
    height:1.6cqw; min-height:5px;
    border:1px solid var(--scr-line-strong);
    background:rgba(0,0,0,0.28);
    border-radius:2px;
    overflow:hidden;
  }
  .hud-bar-fill{
    height:100%; width:64%;
    background:linear-gradient(90deg, #4f97b8, var(--scr-cyan));
    box-shadow:0 0 1cqw rgba(143,214,255,0.6);
  }
  .hud-status{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:1.9cqw; color:#7fd39b;
    display:flex; align-items:center; gap:0.8cqw;
    padding-left:1.6cqw; border-left:1px solid var(--scr-line);
  }
  .hud-status .dot{
    width:1.6cqw; height:1.6cqw; min-width:5px; min-height:5px;
    border-radius:50%; background:#7fd39b;
    box-shadow:0 0 1cqw #7fd39b;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; } 50%{ opacity:0.35; }
  }

  /* ---- main menu ---- */
  .menu{
    flex:1 1 auto;
    margin-top:2.2cqw;
    display:flex; flex-direction:column;
    min-height:0;
    gap:2cqw;
  }

  .tile-primary{
    flex:0 0 auto;
    display:flex; align-items:center; gap:2.6cqw;
    padding:3cqw 3.4cqw;
    border:1.4px solid var(--scr-cyan);
    background:linear-gradient(135deg, rgba(143,214,255,0.16), rgba(143,214,255,0.03));
    border-radius:1cqw;
    cursor:pointer;
    color:inherit;
    font-family:inherit;
    text-align:left;
    box-shadow:0 0 2.4cqw rgba(143,214,255,0.18);
    position:relative;
    overflow:hidden;
  }
  .tile-primary::after{
    content:"";
    position:absolute; top:0; bottom:0; left:-40%;
    width:30%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    animation:shine 4.5s ease-in-out infinite;
  }
  @keyframes shine{
    0%{ left:-40%; } 45%{ left:130%; } 100%{ left:130%; }
  }
  .tile-primary .ico{
    width:9cqw; height:9cqw; min-width:28px; min-height:28px;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border:1.4px solid var(--scr-cyan); border-radius:50%;
  }
  .tile-primary .ico svg{ width:52%; height:52%; color:var(--scr-cyan); }
  .tile-primary .txt .t1{
    font-size:4.4cqw; font-weight:700; letter-spacing:0.06em;
    color:#eaf5ff;
    text-shadow:var(--phosphor);
  }
  .tile-primary .txt .t2{
    margin-top:0.4cqw;
    font-family:'JetBrains Mono',monospace;
    font-size:1.9cqw; letter-spacing:0.04em; color:var(--scr-text-dim);
  }
  .tile-primary .arrow{
    margin-left:auto; color:var(--scr-cyan); flex:0 0 auto;
    width:4.4cqw; height:4.4cqw; min-width:14px; min-height:14px;
  }

  .tile-grid{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:1.6cqw;
    min-height:0;
  }
  .tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1cqw;
    border:1px solid var(--scr-line);
    border-radius:0.8cqw;
    background:rgba(255,255,255,0.02);
    color:inherit; font-family:inherit;
    cursor:pointer;
    position:relative;
  }
  .tile .ico{
    width:6.6cqw; height:6.6cqw; min-width:20px; min-height:20px;
    color:var(--scr-text);
  }
  .tile .ico svg{ width:100%; height:100%; }
  .tile .lbl{
    font-size:2.3cqw; letter-spacing:0.03em; font-weight:600;
    color:var(--scr-text);
  }
  .tile .badge{
    position:absolute; top:0.8cqw; right:0.8cqw;
    min-width:3cqw; height:3cqw;
    padding:0 0.6cqw;
    border-radius:1.5cqw;
    background:var(--scr-amber);
    color:#2a1d05;
    font-family:'JetBrains Mono',monospace;
    font-size:1.6cqw; font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- bottom bar ---- */
  .bottombar{
    flex:0 0 auto;
    margin-top:1.8cqw;
    padding-top:1.4cqw;
    border-top:1px solid var(--scr-line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .bottombar .icon-btn svg{ color:var(--scr-text-dim); }
  .bottombar .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:1.7cqw; letter-spacing:0.12em; color:var(--scr-text-dim);
  }
</style>
</head>
<body>

<div class="stage">
  <img class="bg" src="monitor_blank.png" alt="">

  <div class="screen">
    <div class="screen-content">

      <div class="topbar">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-text">
            <div class="b1">EQUATOR</div>
            <div class="b2">STATION</div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="clock" id="clock">14:28</div>
          <div class="icon-btn" title="Меню">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 16.5V7.5a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7.5v9a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg>
          </div>
        </div>
      </div>

      <div class="hud">
        <div class="hud-level">
          <div class="lv-num">07</div>
          <div class="lv-lbl">LVL</div>
        </div>
        <div class="hud-mid">
          <div class="hud-name-row">
            <div class="hud-name">Н. АЛЬТМАН</div>
            <div class="hud-xp-label">2 140&nbsp;/&nbsp;3 000</div>
          </div>
          <div class="hud-bar"><div class="hud-bar-fill"></div></div>
        </div>
        <div class="hud-status"><span class="dot"></span>ONLINE</div>
      </div>

      <div class="menu">
        <button class="tile-primary" type="button">
          <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          </span>
          <span class="txt">
            <div class="t1">НАЧАТЬ ИГРУ</div>
            <div class="t2">ПОИСК СЕССИИ // EQUATOR-01</div>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <div class="tile-grid">
          <button class="tile" type="button">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="lbl">ДОСЬЕ</span>
          </button>
          <button class="tile" type="button">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="7" height="7"/><rect x="14" y="4" width="7" height="7"/><rect x="3" y="15" width="7" height="7"/><rect x="14" y="15" width="7" height="7"/></svg></span>
            <span class="lbl">КОМНАТЫ</span>
          </button>
          <button class="tile" type="button">
            <span class="badge">3</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
            <span class="lbl">ДРУЗЬЯ</span>
          </button>
          <button class="tile" type="button">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>
            <span class="lbl">РЕЙТИНГ</span>
          </button>
          <button class="tile" type="button">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>
            <span class="lbl">ПРАВИЛА</span>
          </button>
          <button class="tile" type="button">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.66.73.83.32.18.69.24 1.05.17H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span>
            <span class="lbl">НАСТРОЙКИ</span>
          </button>
        </div>
      </div>

      <div class="bottombar">
        <div class="icon-btn" title="Разделы">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </div>
        <div class="tag">EQUATOR-01 // SEC-B</div>
        <div class="icon-btn" title="Ещё">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </div>
      </div>

    </div>

    <div class="crt-scanlines"></div>
    <div class="crt-sweep"></div>
    <div class="crt-vignette"></div>
    <div class="crt-flicker"></div>
  </div>
</div>

<script>
  function tick(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = hh+':'+mm;
  }
  tick();
  setInterval(tick, 15000);

  // --- Telegram Mini App init ---
  // Работает только внутри Telegram; при обычном открытии в браузере
  // просто ничего не делает (проверка window.Telegram.WebApp).
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();     // сообщаем клиенту Telegram, что страница готова
    tg.expand();    // разворачиваем на весь экран
    // при желании подхватить тему Telegram:
    // document.body.style.backgroundColor = tg.themeParams.bg_color || '#050607';
  }
</script>

</body>
</html>
